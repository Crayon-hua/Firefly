name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Astro content types
        run: pnpm astro sync

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm run build

      - name: Prepare dist metadata
        run: touch dist/.nojekyll

      - name: Pack dist
        run: |
          cd dist
          zip -r ../firefly-dist.zip .

      - name: Pack upy bundle
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          mkdir -p bundle/dist
          cp -r dist/. bundle/dist/
          cat > bundle/upy.yaml <<EOF
          name: firefly
          version: "${VERSION}"
          type: static
          static:
            directory: dist
          EOF
          cd bundle && zip -r ../bundle.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            firefly-dist.zip
            bundle.zip
          body: |
            Commit: `${{ github.sha }}`

            **upy CD**（`deploy.yaml` 中 `asset: bundle.zip`）：

            ```bash
            curl -L -o bundle.zip "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/bundle.zip"
            ```

            **直接解压静态站**（扁平 dist，无需 Token）：

            ```bash
            curl -L -o firefly-dist.zip "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/firefly-dist.zip"
            ```

      - name: Trigger upy deployment
        env:
          UPY_WEBHOOK_URL: https://upy.qynexai.cn/api/v1/webhook/firefly
          UPY_WEBHOOK_SECRET: ${{ secrets.UPY_WEBHOOK_SECRET }}
          TAG: ${{ github.ref_name }}
        run: |
          payload='{"target":"'${TAG}'","force":false}'
          sig=$(printf %s "$payload" | openssl dgst -sha256 -hmac "$UPY_WEBHOOK_SECRET" | sed 's/^.*= //')
          curl -fsS -X POST "$UPY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$sig" \
            -d "$payload"
